# Loadbreaker — QA Environment Configuration
# ==========================================
# This is the chart's DEFAULT values file, deliberately — not env/qa/values.yaml.
# Helm reads ./values.yaml automatically, so ArgoCD picks it up with no
# `helm.valueFiles` configuration on the Application. That matters for more than
# convenience: .github/workflows/deploy.yml rewrites the image tag in this file,
# so CI and ArgoCD are guaranteed to read the same file — see sz-battery-game /
# sz-zero-hour-game for the same pattern.

image:
  repository: harbor.qa.stagezero.co.za/library/sz-loadbreaker-game
  tag: "mobile-fix"
  pullPolicy: Always

# Pull credentials for Harbor.
#
# A NEW namespace inherits no pull auth. If the first sync gives
# ImagePullBackOff, create the secret in this namespace and list it here, e.g.:
#   imagePullSecrets:
#     - name: harbor-pull-secret
imagePullSecrets: []

replicaCount: 1

# A static file server. Every expensive thing in this app (the timer, the
# combo meter, the scoring) runs in the visitor's browser, not in the pod.
resources:
  requests:
    cpu: "10m"
    memory: "16Mi"
  limits:
    cpu: "100m"
    memory: "64Mi"

service:
  type: ClusterIP
  port: 80
  targetPort: 8080   # nginx-unprivileged listens on 8080 as a non-root uid

ingress:
  enabled: true
  className: nginx
  host: loadbreaker.qa.stagezero.co.za
  tlsSecret: qa-cert
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"

healthCheck:
  path: /healthz
  initialDelaySeconds: 2
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3
